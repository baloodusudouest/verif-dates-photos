name: docker

# Les tests tournent DANS l'image construite (exiftool et ffmpeg y sont déjà) :
# plus aucune installation de paquets apt sur la machine GitHub, qui bloquait par moments.
# L'image n'est publiée que si les tests passent.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: echo "version=$(grep -oP '__version__ = \"\K[^\"]+' app/app.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Construction de l'image (locale, pour les tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: verif-dates-photos:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests dans l'image
        run: |
          docker run --rm -e TZ=Europe/Paris -v "$PWD:/src" -w /src verif-dates-photos:test \
            sh -c "pip install -q --no-cache-dir pytest && python -m pytest -q"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication sur GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/baloodusudouest/verif-dates-photos:latest
            ghcr.io/baloodusudouest/verif-dates-photos:${{ steps.v.outputs.version }}
            ghcr.io/baloodusudouest/verif-dates-photos:sha-${{ github.sha }}
          cache-from: type=gha
