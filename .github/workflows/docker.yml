name: docker

# Les tests tournent DANS l'image construite (exiftool et ffmpeg y sont déjà) :
# plus aucune installation de paquets apt sur la machine GitHub, qui bloquait par moments.
# L'image n'est publiée que si les tests passent. Les tests d'écran (Playwright) tournent avant chaque
# envoi sur la machine de travail ; ici ils sont sautés (interface non compilée dans le dépôt).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: echo "version=$(grep -oP '__version__ = \"\K[^\"]+' app/__init__.py)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Construction de l'image (locale, pour les tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: verif-dates-photos:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests dans l'image
        run: |
          docker run --rm -e TZ=Europe/Paris -v "$PWD:/src" -w /src verif-dates-photos:test \
            sh -c "pip install -q --no-cache-dir pytest httpx==0.28.1 && python -m pytest -q"
          # l'interface compilée est bien dans l'image, et l'outil démarre
          docker run --rm verif-dates-photos:test test -f /srv/app/static/index.html
          docker run -d --name essai -e VERIF_PASSWORD=essai verif-dates-photos:test
          for i in $(seq 1 30); do docker exec essai python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8099/health').read().decode())" && break; sleep 1; done
          docker exec essai python -c "import urllib.request;assert b'id=\"app\"' in urllib.request.urlopen('http://127.0.0.1:8099/').read()"
          docker rm -f essai

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication sur GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/baloodusudouest/verif-dates-photos:latest
            ghcr.io/baloodusudouest/verif-dates-photos:${{ steps.v.outputs.version }}
            ghcr.io/baloodusudouest/verif-dates-photos:sha-${{ github.sha }}
          cache-from: type=gha
